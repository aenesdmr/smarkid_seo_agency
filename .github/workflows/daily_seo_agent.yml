name: Daily Smartkid SEO Agent

on:
  schedule:
    # TSİ 09:17 (06:17 UTC) - Sabah Yayını
    - cron: '17 6 * * *'
    # TSİ 18:17 (15:17 UTC) - Akşam Yayını
    - cron: '17 15 * * *'
  workflow_dispatch:
    # Manuel çalıştırma tetikleyicisi (İstediğiniz zaman panelden çalıştırabilirsiniz)
    inputs:
      topic_index:
        description: 'Yayınlanacak konu index numarası (Opsiyonel, boş bırakılırsa sıralı gider)'
        required: false
        default: ''

jobs:
  run-agent:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run SEO Agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FRAMER_API_KEY: ${{ secrets.FRAMER_API_KEY }}
          FRAMER_PROJECT_URL: ${{ secrets.FRAMER_PROJECT_URL }}
          FRAMER_COLLECTION_ID: ${{ secrets.FRAMER_COLLECTION_ID }}
          USE_GOOGLE_SEARCH: ${{ secrets.USE_GOOGLE_SEARCH }}
          GITHUB_EVENT_SCHEDULE: ${{ github.event.schedule }}
          MAKE_WEBHOOK_URL: ${{ secrets.MAKE_WEBHOOK_URL }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
        run: |
          if [ -n "${{ github.event.inputs.topic_index }}" ]; then
            node index.js --topic ${{ github.event.inputs.topic_index }}
          else
            node index.js
          fi

      - name: Commit updated state.json (SIO issue counter)
        if: always()
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add state.json || true
          git commit -m "chore: update SIO issue number counter in state.json [skip ci]" || true
          git push || true

      - name: Send error email on failure
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "❌ Smartkid Blog Ajanı Hatası!"
          to: demir@smartkid.agency
          from: Smartkid SEO Agent <noreply@smartkid.agency>
          body: |
            Smartkid SEO Ajanı çalışırken bir hata oluştu veya süreç yarıda kesildi!

            Hata Detayları ve Loglar: https://github.com/aenesdmr/smarkid_seo_agency/actions/runs/${{ github.run_id }}

